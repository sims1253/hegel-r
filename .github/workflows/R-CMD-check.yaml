# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: "release"}
          - {os: ubuntu-latest, r: "devel", http-user-agent: "release"}
          - {os: macos-latest, r: "release"}
          - {os: windows-latest, r: "release"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Since r-lib/actions v2, `needs: check` only installs packages listed
      # under Config/Needs/check in DESCRIPTION; rcmdcheck itself must be
      # requested via extra-packages or the check step cannot run.
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          needs: check
          extra-packages: any::rcmdcheck

      # The engine is loaded at runtime, never linked at install time, so the
      # package installs without it. Installing the package first lets the
      # next step download libhegel into hegelr's cache directory, which
      # R CMD check then picks up. bash avoids PowerShell's built-in `r`
      # alias (Invoke-History), which swallows `R CMD INSTALL` on Windows.
      - name: Install package
        run: R CMD INSTALL .
        shell: bash

      # libhegel publishing may lag behind package changes, and a platform
      # may not have a published artifact at all; when this step fails, the
      # online tests skip gracefully and only the offline suite runs.
      - name: Install libhegel engine
        run: Rscript -e 'try(hegelr::hegel_install())'
        continue-on-error: true

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          error-on: '"error"'
